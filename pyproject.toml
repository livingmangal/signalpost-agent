[project]
name = "signalpost-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "extruct>=0.18,<1",
  "lxml>=6,<7",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
  "duckduckgo-search>=7.0,<8",
  "primp<0.14",
  "rapidfuzz>=3.9,<4",
  "phonenumbers>=8.13,<9",
  "httpx>=0.28,<1",
  "google-genai>=1.0,<2",
  "feedparser>=6.0,<7",
]

[project.optional-dependencies]
crawler = [
  "scrapy>=2.13,<3",
  "scrapy-playwright>=0.0.44,<1",
]
sentiment = [
  "accelerate>=1.10,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[tool.uv]
package = false
